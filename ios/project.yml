# XcodeGen project definition — the committed source of truth for the iOS
# project. The generated SemaphoreTranslator.xcodeproj is git-ignored;
# regenerate it with `xcodegen generate` (see ios/README.md).
name: SemaphoreTranslator
options:
  bundleIdPrefix: com.skylinetrailcomputing
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: "YES"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SemaphoreTranslator:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # The frozen shared contract, bundled as app resources so the runtime
      # `ContractLoader` can build the decoder on-device. Referenced straight
      # from `../shared` (no committed copy) — `shared/` stays single-source,
      # the same posture as the test harness reaching it via `#filePath`.
      - path: ../shared/semaphore_alphabet.json
        buildPhase: resources
      - path: ../shared/semaphore_config.json
        buildPhase: resources
      # The first-launch disclaimer doc (#87), bundled verbatim so the gate's
      # SHA-256 consent hash matches Android's over the same bytes.
      - path: ../shared/disclaimer.json
        buildPhase: resources
      # The Learn sight-read stock passages (#71), bundled verbatim so the picker
      # shows the same list as Android (`StockPassages.loadBundled`).
      - path: ../shared/stock_passages.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skylinetrailcomputing.semaphore
        # Distribution signing (#83). The Team ID + automatic style let `xcodebuild
        # archive` resolve certs/profiles for the Skyline team. Inert for the CI
        # simulator unit run, which overrides `CODE_SIGNING_ALLOWED=NO` (signing is
        # skipped regardless of these keys); only engages at archive time. Note: the
        # Tier lock-in is creating the ASC app record, not this config line.
        DEVELOPMENT_TEAM: KAM77V889Y
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Home-screen name parity with Android's "Semaphore Translator" label
        # (the bare target name would otherwise read "SemaphoreTranslator").
        INFOPLIST_KEY_CFBundleDisplayName: Semaphore Translator
        # Export-compliance declaration: the app is fully on-device/offline and
        # makes no network calls, so it uses no non-exempt encryption. Declaring
        # this NO skips the per-build "Provide Export Compliance Information"
        # prompt that otherwise gates every TestFlight build.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        # Portrait-locked, iPhone-only (#130). The pose pipeline is portrait-pinned
        # by construction (PoseCaptureSession/CameraPreviewView pin the capture +
        # preview rotation to 90°; the adapter mirror + y-flip and every
        # frozen-contract arm angle assume that upright frame). Allowing the UI to
        # rotate would desync the geometry. iPhone-only also removes the iPad
        # multitasking "support all orientations or require full screen" warning at
        # its source. NOT related to #61 (data-driven *decode* facing — post-beta).
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Belt-and-suspenders: iPhone-only means an iPad runs this in the .phone
        # compatibility idiom (base key governs, this ~ipad key is inert), but
        # pinning it too removes any doubt for a tester who sideloads onto an iPad
        # and future-proofs a later flip to a universal (device-family {1,2}) build.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_NSCameraUsageDescription: "Used on-device to read semaphore flag positions from the camera. Frames are processed live and never stored or transmitted."
  SemaphoreTranslatorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: SemaphoreTranslator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skylinetrailcomputing.semaphore.tests
  # UI tests (XCUITest) — drive the running app via accessibility. Kept in a
  # separate bundle.ui-testing target (its own host process) so the fast unit
  # suite stays decoupled from the slow, simulator-driving UI tests. Today it
  # pins the Learn custom-passage push→back navigation regression (#104).
  SemaphoreTranslatorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: SemaphoreTranslator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skylinetrailcomputing.semaphore.uitests
        TEST_TARGET_NAME: SemaphoreTranslator
schemes:
  # Default scheme — its `test` action runs only the fast unit suite. The UI test
  # bundle still builds here (so it's compile-checked on every build and can't rot)
  # but is intentionally kept OUT of the default test action: it launches the app
  # and drives the simulator (slow + stateful), so `xcodebuild test -scheme
  # SemaphoreTranslator` should stay the quick unit run. Use the dedicated
  # `SemaphoreTranslatorUITests` scheme below to run the XCUITests.
  SemaphoreTranslator:
    build:
      targets:
        SemaphoreTranslator: all
        SemaphoreTranslatorTests: [test]
        SemaphoreTranslatorUITests: [test]
    test:
      targets:
        - SemaphoreTranslatorTests
  # Opt-in scheme for the XCUITests (`xcodebuild test -scheme
  # SemaphoreTranslatorUITests`). Separated so the UI tests run only when asked.
  SemaphoreTranslatorUITests:
    build:
      targets:
        SemaphoreTranslator: all
        SemaphoreTranslatorUITests: [test]
    test:
      targets:
        - SemaphoreTranslatorUITests
