# Version catalog — single source of truth for plugin/library versions.
# AGP 9.0+ provides built-in Kotlin compilation, so no separate Kotlin Gradle
# plugin is applied (and the kotlinx-serialization compiler plugin with it).
# JSON is parsed reflectively with Gson to keep the build free of Kotlin
# compiler-plugin configuration under AGP's built-in Kotlin.
[versions]
agp = "9.2.1"
gson = "2.13.2"
junit = "4.13.2"
# Epic 3 (#22) — CameraX capture + ML Kit pose + the first instrumented tests.
camerax = "1.6.1"
mlkitPose = "18.0.0-beta5"
coroutines = "1.11.0"
androidxTestJunit = "1.2.1"
androidxTestRunner = "1.6.2"
# Epic 3 (#23) — Jetpack Compose live debug UI. The Compose compiler plugin
# version MUST match AGP 9.2.1's built-in Kotlin (2.2.10); a mismatch fails the
# build. composeBom 2024.12.01 pins ui 1.7.6 / material3 1.3.1.
composeCompiler = "2.2.10"
composeBom = "2024.12.01"
activityCompose = "1.9.3"
lifecycleRuntimeCompose = "2.8.7"
# Epic 5 (#47) — Compose Navigation for the Home → mode fork. Stays on the 2.8.x
# line (built against Compose 1.7.x, matching composeBom 2024.12.01); 2.9.x would
# pull Compose 1.8 in against the pinned BOM.
navigationCompose = "2.8.9"

[libraries]
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
junit = { module = "junit:junit", version.ref = "junit" }
camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
# Bundled ML Kit pose model — ships the model in the AAR, so it needs no Google
# Play Services (runs on a bare AOSP/emulator and on-device alike).
mlkit-pose-detection = { module = "com.google.mlkit:pose-detection", version.ref = "mlkitPose" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
# CameraX PreviewView (the live preview surface) — #23.
camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
# Jetpack Compose (#23). Versions come from the BOM; activity-compose carries
# setContent + the permission-request launcher.
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-material3 = { module = "androidx.compose.material3:material3" }
# Core Material icon set (ArrowBack for the Up affordance, #47) — BOM-versioned.
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }
# Compose Navigation host for the Home → mode fork (#47).
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# Compose compiler plugin, pinned to the built-in Kotlin version (see [versions]).
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "composeCompiler" }
