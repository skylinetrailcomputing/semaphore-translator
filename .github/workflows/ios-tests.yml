name: ios-tests

# Per-commit iOS unit tests — the cross-platform parity harness (#14) plus
# the Layer-1 Vision adapter tests. Runs on a Simulator (no signing); the
# device-only Layer-2 Vision calibration is skipped on the Simulator.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ios-tests:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select an available iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          NAME=$(xcrun simctl list devices available \
            | grep -oE 'iPhone [0-9]+( Pro)?' | head -1)
          if [ -z "$NAME" ]; then
            echo "No available iPhone simulator found" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Using simulator: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Run parity + adapter unit tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project SemaphoreTranslator.xcodeproj \
            -scheme SemaphoreTranslator \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            CODE_SIGNING_ALLOWED=NO
