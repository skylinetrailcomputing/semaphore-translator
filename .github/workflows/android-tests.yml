name: android-tests

# Per-commit Android JVM unit tests — the cross-platform parity harness
# (#14) plus the Layer-1 adapter regression (#22). No emulator: the
# instrumented Layer-2 calibration (connectedDebugAndroidTest) is device-only
# and deliberately excluded here.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK platform 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: JVM unit tests (incl. parity harness)
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-report
          path: android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
